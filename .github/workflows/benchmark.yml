# Run time of NetLogo, gobees and gobees-fast on the example farm (go/benchmark/README.md). Runs only in pull
# requests with the label "benchmark": when the label is added, on every push to the pull request while it has the
# label, and when its base branch changes (e.g. retargeted to main after the step below was merged).
#
# NetLogo 5.3.1, gobees-fast and gobees (the base commit of go/compare/commits.env) run one after the other on the
# same runner, with the same seeds, days and number of runs at the same time. Then gobees-fast runs alternately with
# the program of the branch below the pull request (its base branch, e.g. main or the previous step of a stack), one
# run at a time, BENCHMARK_BELOW_SEEDS seeds BENCHMARK_ROUNDS times each (go/benchmark/README.md). The workflow adds
# the report go/benchmark/benchmark-report.md to the summary of the run and uploads it as artifact "benchmark". In a
# pull request into main it also commits the report to the branch of the pull request, so that a squash merge brings
# it to main. In a pull request higher up in a stack it does not commit: a commit there moves the tip of the branch,
# and every branch above would have to be rebased after every run. When such a pull request is retargeted to main,
# the workflow runs again and commits the report then.
name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

# An edit of title or text ("edited" without a change of the base branch) gets a group of its own, so that it does
# not cancel a running benchmark. Its job is skipped.
concurrency:
  group: benchmark-${{ github.head_ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edited' || '' }}
  cancel-in-progress: true

env:
  NETLOGO_URL: https://downloads.netlogo.org/5.3.1/NetLogo-5.3.1-64.tgz
  NETLOGO_SHA256: 07a626e486606f3d92fd39f7986641fb3f6bb8a00828f583b3b1804446a1c87c
  # runs at the same time, in both models (a runner of a private repository has 2 cores)
  BENCHMARK_THREADS: 2
  # comparison with the branch below: the seeds 1 to BENCHMARK_BELOW_SEEDS, runs per seed and program (the fastest
  # counts). Many seeds, few rounds: after a statistically equal step the runs of a seed differ in their work.
  BENCHMARK_BELOW_SEEDS: 40
  BENCHMARK_ROUNDS: 3

jobs:
  benchmark:
    # On "labeled" only when the added label is "benchmark", not when another label is added to such a pull request.
    # On "edited" only when the base branch changed.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark') &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the report to the branch of a pull request into main
      pull-requests: write # to comment in the pull request
    steps:
      # the full history: the base commit is checked out as a worktree
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The same Java as in the local validation runs (go/validation/README.md). Newer than the Java 8 shipped with
      # NetLogo 5.3.1, which favours NetLogo, if anything.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache NetLogo
        id: cache-netlogo
        uses: actions/cache@v4
        with:
          path: ~/netlogo
          key: netlogo-${{ env.NETLOGO_SHA256 }}

      - name: Download NetLogo
        if: steps.cache-netlogo.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/netlogo.tgz" "$NETLOGO_URL"
          echo "$NETLOGO_SHA256  $RUNNER_TEMP/netlogo.tgz" | sha256sum -c
          mkdir -p ~/netlogo
          tar xzf "$RUNNER_TEMP/netlogo.tgz" -C ~/netlogo

      # Compiled before NetLogo runs, so that nothing else runs on the runner while NetLogo is timed. gobees is the
      # command line program of the base commit, gobees-fast the one of the current code, below the one of the
      # newest commit of the base branch of the pull request.
      - name: Build gobees-fast, gobees and the branch below
        env:
          BELOW_SHA: ${{ github.event.pull_request.base.sha }}
          BELOW_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          source go/compare/commits.env
          git worktree add --detach --quiet "$RUNNER_TEMP/base" "$BASE_COMMIT"
          go -C "$RUNNER_TEMP/base/go" build -o "$RUNNER_TEMP/gobees" .
          git worktree remove --force "$RUNNER_TEMP/base"
          git worktree add --detach --quiet "$RUNNER_TEMP/below" "$BELOW_SHA"
          go -C "$RUNNER_TEMP/below/go" build -o "$RUNNER_TEMP/below-bin" .
          git worktree remove --force "$RUNNER_TEMP/below"
          echo "BENCHMARK_BELOW_COMMIT=$(git rev-parse --short "$BELOW_SHA^{commit}")" >> "$GITHUB_ENV"
          echo "BENCHMARK_BELOW_BRANCH=$BELOW_BRANCH" >> "$GITHUB_ENV"
          go -C go build -o "$RUNNER_TEMP/gobees-fast" .
          go -C go test -c -o "$RUNNER_TEMP/benchmark.test" ./benchmark
          echo "BENCHMARK_BASE_COMMIT=$(git rev-parse --short "$BASE_COMMIT^{commit}")" >> "$GITHUB_ENV"

      - name: Machine
        run: lscpu

      - name: Run NetLogo
        run: bash go/benchmark/run_netlogo.sh ~/netlogo/netlogo-5.3.1-64 "$BENCHMARK_THREADS" "$RUNNER_TEMP/netlogo_table.csv" "$RUNNER_TEMP/netlogo_console.txt"

      - name: Run gobees-fast and gobees and write the report
        working-directory: go/benchmark
        env:
          BENCHMARK_NETLOGO_TABLE: ${{ runner.temp }}/netlogo_table.csv
          BENCHMARK_NETLOGO_CONSOLE: ${{ runner.temp }}/netlogo_console.txt
          BENCHMARK_BASE_BIN: ${{ runner.temp }}/gobees
          BENCHMARK_CURRENT_BIN: ${{ runner.temp }}/gobees-fast
          BENCHMARK_BELOW_BIN: ${{ runner.temp }}/below-bin
          BENCHMARK_COMMENT: ${{ runner.temp }}/benchmark-comment.md
          # the report in the branch where it is committed (pull request into main, see the last step), else the
          # summary of this run, which holds the whole report
          BENCHMARK_REPORT_URL: ${{ github.base_ref == 'main' && format('{0}/{1}/blob/{2}/go/benchmark/benchmark-report.md', github.server_url, github.repository, github.head_ref) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_REPORT: ${{ github.workspace }}/go/benchmark/benchmark-report.md
        run: |
          export BENCHMARK_JAVA="$(java -version 2>&1 | head -n 1)"
          "$RUNNER_TEMP/benchmark.test" -test.run '^TestCompareWithNetLogo$' -test.count 1 -test.v -test.timeout 20m

      - name: Summary
        if: always()
        run: |
          if [ -f go/benchmark/benchmark-report.md ]; then
            cat go/benchmark/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One comment per pull request with the main tables, updated on every run (marker benchmark.CommentMarker).
      # Only in a pull request from this repository: the token of a fork cannot write comments. No comment if the
      # benchmark failed before writing it.
      - name: Comment on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ runner.temp }}/benchmark-comment.md
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.COMMENT_FILE)) {
              core.info('No comment was written.');
              return;
            }
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            const marker = '<!-- benchmark-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            go/benchmark/benchmark-report.md
            ${{ runner.temp }}/netlogo_table.csv
            ${{ runner.temp }}/netlogo_console.txt
          if-no-files-found: ignore

      # Only in a pull request from this repository into main. In a stack of pull requests (base branch is the
      # previous step), a commit here would move the tip of the branch, so that every branch above would have to be
      # rebased after every run. The report of such a pull request is in the summary and in the artifact, and it is
      # committed in the run started when the pull request is retargeted to main. A commit pushed with the
      # GITHUB_TOKEN does not start a new workflow run. The Tests workflow may push its report to the same branch at
      # the same time, so the push is retried on top of the newest state of the branch.
      - name: Commit the report to the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/benchmark/benchmark-report.md
          if git diff --cached --quiet; then
            echo "The report did not change."
            exit 0
          fi
          git commit -m "Update benchmark report [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.head_ref }} && git push origin HEAD:${{ github.head_ref }} && exit 0
            sleep 10
          done
          exit 1
