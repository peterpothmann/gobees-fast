# Runs the comparisons of go/compare on every pull request and every push to main: the current code against the
# reference commit (exact and statistical) and against the base commit (speed), both from go/compare/commits.env.
# The results are shown in the summary of the run. Details: go/compare/README.md.
name: Compare

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compare-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment in the pull request
    steps:
      # the full history: the reference and the base commit are checked out as worktrees
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Compare with the reference and the base commit
        id: compare
        env:
          COMPARE_REPORT: ${{ github.workspace }}/compare-report.md
        run: bash go/compare/run_compare.sh

      - name: Summary
        if: always()
        run: |
          if [ -f compare-report.md ]; then
            cat compare-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One comment per pull request, updated on every run: the result in the first line, then the report.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.compare.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compare-report -->';
            const report = fs.existsSync('compare-report.md') ? fs.readFileSync('compare-report.md', 'utf8') : '';
            const result = process.env.OUTCOME === 'success'
              ? '✅ **Results unchanged** against the reference commit.'
              : '❌ **Results changed or the comparison failed.** The first difference is in the report below.';
            const body = marker + '\n## Comparison with the reference commit\n\n' + result + '\n\n' + report;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
