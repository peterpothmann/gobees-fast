# Runs on every pull request and every push to main: formatting, go vet and all Go tests, incl. the comparison
# with NetLogo (go/sys/validation_*_test.go, go/model/validation_step*_test.go). NetLogo itself does not run here:
# its reference results are embedded in go/validation, see go/validation/README.md.
#
# The comparison tests write the report go/validation/validation-report.md and one plot per experiment to
# go/validation/plots/. In a pull request, the workflow commits both to the branch of the pull request, so that a
# squash merge brings code, report and plots to main together.
# On main it only runs the tests and never commits.
# The summary of each run shows all test results and the comparison report. Both are also uploaded as artifact
# "reports".
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the running workflow, so that two runs never push a report at the same time.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the report to the branch of a pull request
    defaults:
      run:
        working-directory: go
    steps:
      # In a pull request, check out the branch itself (not GitHub's merge commit), so that the report can be
      # committed to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # v1.12.x does not build with Go 1.26 (old golang.org/x/tools), v1.13.0 does.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # The comparison tests write their sections to VALIDATION_REPORT (Markdown) and their plots next to it. The
      # report and the plots of the checkout are deleted first, so that they hold only the results of this run.
      - name: Test
        env:
          VALIDATION_REPORT: ${{ github.workspace }}/go/validation/validation-report.md
        run: |
          rm -f "$VALIDATION_REPORT"
          rm -rf "$(dirname "$VALIDATION_REPORT")/plots"
          gotestsum --format testname --junitfile ${{ github.workspace }}/test-results.xml -- -count=1 -timeout 30m ./...

      - name: Summary of all tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results.xml

      - name: Comparison with NetLogo
        if: always()
        working-directory: .
        run: |
          if [ -f go/validation/validation-report.md ]; then
            cat go/validation/validation-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            test-results.xml
            go/validation/validation-report.md
            go/validation/plots/
          if-no-files-found: ignore

      # Only in a pull request from this repository and only if all tests passed. A commit pushed with the
      # GITHUB_TOKEN does not start a new workflow run. The gobees runs use fixed seeds, so the report changes only
      # when the results change, and only then a commit is made.
      - name: Commit the report to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/validation/validation-report.md
          git add -A go/validation/plots
          if git diff --cached --quiet; then
            echo "The report did not change."
          else
            git commit -m "Update validation report and plots [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
