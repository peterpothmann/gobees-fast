# Runs on every pull request and every push to main. Two jobs:
#
#   - test: formatting, go vet and all Go tests of gobees-fast, incl. the comparisons of parts of the model with
#     NetLogo (go/sys/validation_step*_test.go), and the same for the converter tools/netlogo2gobees, whose tests check
#     that the run files in the repository are up to date, and vet and tests of the window (build tag ui).
#   - compare: at the same time, the check of the step (go/compare/run_compare.sh): every scenario of the full model
#     against the previous step (reference commit), gobees and NetLogo, and the speed against gobees. It writes one
#     comment with the results, in the pull request (updated on every run) and in the summary of the run, and the
#     NetLogo report go/validation/validation-report.md with one plot per scenario, uploaded as artifact
#     "validation". Only on main it commits report and plots, after a merge, if all comparisons passed. It never
#     commits to the branch of a pull request: a commit there moves the tip of the branch, so the author would have
#     to pull or rebase after every run, and every branch above it in a stack too.
#
# NetLogo itself does not run here: its results are embedded in go/validation, see go/validation/README.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the same branch cancels the running workflow, so that two runs never push a report at the same time
# (e.g. a stack of pull requests merged at once pushes several commits to main within seconds).
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # v1.12.x does not build with Go 1.26 (old golang.org/x/tools), v1.13.0 does.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test
        run: gotestsum --format testname --junitfile ${{ github.workspace }}/test-results.xml -- -count=1 -timeout 30m ./...

      # The converter is its own module (tools/netlogo2gobees/go.mod), go vet and go test of go/ do not reach it.
      - name: Converter (tools/netlogo2gobees)
        working-directory: tools/netlogo2gobees
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...

      # The window of gobees --ui (go/ui and go/ui_on.go) is built on Linux only with the tag ui, which the steps
      # above leave out. Ebitengine needs the X11 and OpenGL headers to build on Linux and a display for its tests, here a
      # virtual one (xvfb-run).
      - name: Window (-tags ui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
          go vet -tags ui ./...
          xvfb-run go test -tags ui -short -count=1 . ./ui/

      - name: Summary of all tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results.xml

  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the report is pushed to main with the deploy key, see the checkout step
      pull-requests: write # to comment in the pull request
    steps:
      # In a pull request, the branch itself (not GitHub's merge commit), the code the author pushed. On main, its
      # newest state, so that the report is committed on top of it. The full history: the reference and the base
      # commit are checked out as worktrees.
      # On main with the deploy key: the ruleset of main requires a pull request, and in a personal repository only a
      # deploy key can bypass it, not the GITHUB_TOKEN. The key is the secret DEPLOY_KEY, its public part is the deploy
      # key "CI report push to main" with write access. In a pull request no key, the GITHUB_TOKEN reads the branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          ssh-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DEPLOY_KEY || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Writes comment.md and the report also if a comparison fails.
      - name: Check the step
        id: compare
        env:
          COMPARE_COMMENT: ${{ github.workspace }}/comment.md
          COMPARE_REPORT_DIR: ${{ github.workspace }}/go/validation
          # on main the report in the branch, in a pull request the run, whose summary holds the report and whose
          # artifact "validation" holds report and plots
          COMPARE_REPORT_URL: ${{ github.event_name == 'push' && format('{0}/{1}/blob/{2}/go/validation/validation-report.md', github.server_url, github.repository, github.ref_name) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          COMPARE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash go/compare/run_compare.sh

      - name: Summary
        if: always()
        run: |
          for f in comment.md go/validation/validation-report.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # One comment per pull request, updated on every run.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- check-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Upload report and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            go/validation/validation-report.md
            go/validation/plots
          if-no-files-found: ignore

      # Only on main (after a merge) and only if all comparisons passed. Never in a pull request: a commit there moves
      # the tip of the branch, the author has to pull or rebase before the next push, and in a stack every branch
      # above too. The report of a pull request is in its summary and in the artifact. A commit pushed with the
      # GITHUB_TOKEN does not start a new workflow run. The runs use fixed seeds, so the report changes only when the
      # results change, and only then a commit is made. A merge may push to main at the same time, so the push is
      # retried on top of the newest state of main.
      - name: Commit the report to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compare.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/validation/validation-report.md
          git add -A go/validation/plots
          if git diff --cached --quiet; then
            echo "The report did not change."
            exit 0
          fi
          git commit -m "Update validation report and plots [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
