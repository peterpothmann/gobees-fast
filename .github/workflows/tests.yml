# Runs on every pull request and every push to main. Two jobs:
#
#   - test: formatting, go vet and all Go tests of gobees-fast, incl. the comparisons of parts of the model with
#     NetLogo (go/sys/validation_step*_test.go), and the same for the converter tools/netlogo2gobees, whose tests check
#     that the run files in the repository are up to date.
#   - compare: at the same time, the check of the step (go/compare/run_compare.sh): every scenario of the full model
#     against the previous step (reference commit), gobees and NetLogo, and the speed against gobees. It writes one
#     comment with the results, in the pull request (updated on every run) and in the summary of the run, and the
#     NetLogo report go/validation/validation-report.md with one plot per scenario. In a pull request it commits
#     report and plots to the branch if all comparisons passed, so that a squash merge brings them to main.
#
# NetLogo itself does not run here: its results are embedded in go/validation, see go/validation/README.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the running workflow, so that two runs never push a report at the same time.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # v1.12.x does not build with Go 1.26 (old golang.org/x/tools), v1.13.0 does.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test
        run: gotestsum --format testname --junitfile ${{ github.workspace }}/test-results.xml -- -count=1 -timeout 30m ./...

      # The converter is its own module (tools/netlogo2gobees/go.mod), go vet and go test of go/ do not reach it.
      - name: Converter (tools/netlogo2gobees)
        working-directory: tools/netlogo2gobees
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...

      - name: Summary of all tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results.xml

  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the report to the branch of a pull request
      pull-requests: write # to comment in the pull request
    steps:
      # In a pull request, the branch itself (not GitHub's merge commit), so that the report can be committed to it.
      # The full history: the reference and the base commit are checked out as worktrees.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Writes comment.md and the report also if a comparison fails.
      - name: Check the step
        id: compare
        env:
          COMPARE_COMMENT: ${{ github.workspace }}/comment.md
          COMPARE_REPORT_DIR: ${{ github.workspace }}/go/validation
          COMPARE_REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.head_ref || github.ref_name }}/go/validation/validation-report.md
          COMPARE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash go/compare/run_compare.sh

      - name: Summary
        if: always()
        run: |
          for f in comment.md go/validation/validation-report.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # One comment per pull request, updated on every run.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- check-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      # Only in a pull request from this repository and only if all comparisons passed. A commit pushed with the
      # GITHUB_TOKEN does not start a new workflow run. The runs use fixed seeds, so the report changes only when the
      # results change, and only then a commit is made. The Benchmark workflow may push its report to the same branch
      # at the same time, so the push is retried on top of the newest state of the branch.
      - name: Commit the report to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.compare.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/validation/validation-report.md
          git add -A go/validation/plots
          if git diff --cached --quiet; then
            echo "The report did not change."
            exit 0
          fi
          git commit -m "Update validation report and plots [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.head_ref }} && git push origin HEAD:${{ github.head_ref }} && exit 0
            sleep 10
          done
          exit 1
